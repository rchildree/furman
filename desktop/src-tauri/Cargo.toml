[package]
name = "syllabusser"
version = "0.1.0"
description = "Course schedules and publishing"
authors = ["Randall Childree"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
mime_guess = "2"
percent-encoding = "2"
sha2 = "0.10"
base64 = "0.22"

tempfile = "3"
